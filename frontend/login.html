<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LPG Delivery - Login</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <img src="https://img.icons8.com/fluency/48/000000/gas-pump.png" alt="LPG Shop" />
        <div>
          <h1>LPG Delivery</h1>
          <p>Login to order or manage deliveries</p>
        </div>
      </div>
      <nav class="nav-links">
        <a href="index.html">Home</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section login-section">
      <div class="container">
        <div class="section-title">
          <span>Login</span>
          <h2>Sign in as Customer or Admin</h2>
          <p>Use the public company page for information, and log in here to access your account.</p>
        </div>
        <div class="login-grid">
          <div class="login-card">
            <h3>Customer Login</h3>
            <form id="customerLoginForm">
              <label for="customerEmail">Email</label>
              <input id="customerEmail" type="email" required placeholder="customer@example.com" />
              <label for="customerPassword">Password</label>
              <input id="customerPassword" type="password" required placeholder="customer123" />
              <button type="submit" class="btn btn-primary">Sign in as Customer</button>
            </form>
            <p class="login-status">New customer? <a href="register.html">Register here</a>.</p>
          </div>
          <div class="login-card">
            <h3>Admin Login</h3>
            <form id="adminLoginForm">
              <label for="adminEmail">Email</label>
              <input id="adminEmail" type="email" required placeholder="admin@example.com" />
              <label for="adminPassword">Password</label>
              <input id="adminPassword" type="password" required placeholder="admin123" />
              <button type="submit" class="btn btn-primary">Sign in as Admin</button>
            </form>
          </div>
        </div>
        <p id="statusMessage" class="login-status"></p>
      </div>
    </section>
  </main>

  <script src="config.js"></script>
  <script type="module" src="login.js"></script>
</body>
</html>
