<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LPG Delivery - Admin Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <img src="https://img.icons8.com/fluency/48/000000/gas-pump.png" alt="LPG Shop" />
        <div>
          <h1>Admin Dashboard</h1>
          <p>Manage orders and monitor deliveries</p>
        </div>
      </div>
      <div class="header-actions">
        <a href="index.html" class="btn btn-secondary">Home</a>
        <button id="logoutButton" class="btn btn-secondary">Logout</button>
      </div>
    </div>
  </header>

  <main>
    <section class="section admin-section">
      <div class="container">
        <div class="section-title">
          <span>Admin</span>
          <h2 id="adminWelcome">Hello, Admin</h2>
          <p>View recent customer orders and track order history.</p>
        </div>
        <div class="admin-panel">
          <table class="order-table" id="adminOrdersTable">
            <thead>
              <tr>
                <th>Order</th>
                <th>Customer</th>
                <th>Total</th>
                <th>Items</th>
                <th>Created</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script src="config.js"></script>
  <script type="module" src="admin.js"></script>
</body>
</html>
